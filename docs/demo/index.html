<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaleos · demo del diseño nuevo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two phone-sized apps (Miembro, Pastor) and a desk console (Central).
   Identity: candle-lit night card and generated dawn imagery set on cool fog paper; gold is the only accent. */
:root{
  --bg:#E8EAEE; --surface:#FFFFFF; --surface-2:#F2F3F6; --surface-3:#E9EBF0;
  --ink:#141829; --ink-2:#555B70; --ink-3:#868CA0; --line:#DCDFE6;
  --accent:#986819; --accent-2:#C69744; --accent-soft:#F4EAD7;
  --wine:#85304A; --ok:#2D7451; --warn:#A5661A; --bad:#A63737; --sea:#2D6A86;
  --night:#11162E; --night-2:#1E2650; --card-ink:#F4EEDF; --on-art:#FBF6EC;
  --foil-1:#B8893B; --foil-2:#F3DC9B; --foil-3:#C49646; --gold-line:rgba(216,178,106,.38);
  --lv1:#8C92A6; --lv2:#2D6A86; --lv3:#986819; --lv4:#85304A; --lv5:#1E2650;
  --shadow:0 1px 2px rgba(20,24,41,.06),0 18px 40px -18px rgba(20,24,41,.28);
  --shadow-s:0 1px 2px rgba(20,24,41,.06),0 6px 16px -8px rgba(20,24,41,.18);
  --scrim:rgba(14,17,30,.42);
  --f-disp:"Cormorant Garamond","Cormorant",Garamond,"Times New Roman",serif;
  --f-body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090C17; --surface:#121727; --surface-2:#192034; --surface-3:#202841;
  --ink:#EEEBE3; --ink-2:#A7ACBE; --ink-3:#737A91; --line:#262D45;
  --accent:#D8A855; --accent-2:#E9C584; --accent-soft:#2A2618;
  --wine:#D07189; --ok:#5DBA8A; --warn:#E2A24C; --bad:#E27676; --sea:#6FB2D0;
  --lv1:#7D849A; --lv2:#6FB2D0; --lv3:#D8A855; --lv4:#D07189; --lv5:#B9C2F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7);
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090C17; --surface:#121727; --surface-2:#192034; --surface-3:#202841;
  --ink:#EEEBE3; --ink-2:#A7ACBE; --ink-3:#737A91; --line:#262D45;
  --accent:#D8A855; --accent-2:#E9C584; --accent-soft:#2A2618;
  --wine:#D07189; --ok:#5DBA8A; --warn:#E2A24C; --bad:#E27676; --sea:#6FB2D0;
  --lv1:#7D849A; --lv2:#6FB2D0; --lv3:#D8A855; --lv4:#D07189; --lv5:#B9C2F0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -18px rgba(0,0,0,.7);
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 6px 16px -8px rgba(0,0,0,.6);
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic .d,.ic .df{fill:var(--accent);stroke:none}
.ic.lg{width:30px;height:30px;stroke-width:1.25}
.ic.sm{width:18px;height:18px}
.ic.xs{width:15px;height:15px;stroke-width:1.8}
.on-art .ic .d,.on-art .ic .df{fill:var(--foil-2)}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.fine{font-size:12px;color:var(--ink-3);line-height:1.45}

/* ---------- demo bar ---------- */
.demo{max-width:1240px;margin:0 auto;padding-block:16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;flex-wrap:wrap}
.brand .ic{width:26px;height:26px;color:var(--ink)}
.brand b{font:italic 600 26px/1 var(--f-disp);letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--ink-3);margin-left:6px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap}
.seg button .ic{width:18px;height:18px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button[aria-pressed="true"] .ic .d,.seg button[aria-pressed="true"] .ic .df{fill:var(--accent-2)}
.demo-opts{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.demo-opts:empty{display:none}

/* ---------- dropdown ---------- */
.dd{position:relative;display:inline-block;max-width:100%}
.dd-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px 8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;max-width:100%}
.dd-btn .lab{color:var(--ink-3);font-weight:500}
.dd-btn .val{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.dd-btn .chev{width:16px;height:16px;transition:transform .2s;color:var(--ink-3)}
.dd.open .dd-btn .chev{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:250px;max-width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;z-index:60;
  visibility:hidden;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top left;transition:opacity .16s,transform .16s,visibility 0s .16s;max-height:min(62vh,440px);overflow:auto}
.dd-menu.r{left:auto;right:0;transform-origin:top right}
.dd.open .dd-menu{visibility:visible;opacity:1;transform:none;transition:opacity .16s,transform .16s}
.dd-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:10px}
.dd-item:hover,.dd-item:focus-visible{background:var(--surface-2)}
.dd-item .t{font-weight:600;font-size:14px;line-height:1.25}
.dd-item .s{display:block;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:1px}
.dd-item .ck{width:18px;height:18px;color:var(--accent);opacity:0}
.dd-item[aria-checked="true"] .ck{opacity:1}
.dd-item .ic{color:var(--ink-2)}
.dd-sep{height:1px;background:var(--line);margin:6px 4px}
.dd-head{padding:8px 10px 4px}

/* ---------- phone frame ---------- */
.phone{max-width:430px;margin:6px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:36px;box-shadow:var(--shadow);overflow:clip;position:relative;min-height:820px;display:flex;flex-direction:column}
@media (max-width:480px){.phone{border-radius:0;border-inline:0;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));box-shadow:none}}
.ah{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:14px 18px 12px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ah .wm{display:flex;align-items:center;gap:6px;margin-right:auto}
.ah .wm b{font:italic 600 23px/1 var(--f-disp)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.menudd .dd-btn{border:0;background:transparent;padding:8px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-body);background:var(--surface-3);color:var(--ink);flex:none;letter-spacing:.02em}
.avatar.lg{width:56px;height:56px;font-size:18px}
.main{flex:1;padding:4px 18px 28px;display:flex;flex-direction:column;gap:26px;min-width:0}
.tb{position:sticky;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tb button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0;position:relative}
.tb button .ic{width:24px;height:24px}
.tb button[aria-current="page"]{color:var(--ink)}
.tb button[aria-current="page"]::after{content:"";position:absolute;top:-9px;width:22px;height:2px;border-radius:2px;background:var(--accent)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font:600 30px/1.05 var(--f-disp)}

/* ---------- membership card ---------- */
.mc{perspective:1400px;cursor:pointer;max-width:100%;display:block}
.mc-in{position:relative;aspect-ratio:1.586;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.mc.flip .mc-in{transform:rotateY(180deg)}
.mc-f{position:absolute;inset:0;border-radius:20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;color:var(--card-ink);
  background:radial-gradient(120% 100% at 88% 0%,var(--night-2),var(--night) 62%);border:1px solid var(--gold-line);box-shadow:0 20px 40px -20px rgba(10,13,30,.7)}
.mc-f > canvas{position:absolute;inset:0;width:100%;height:100%}
.mc-b{transform:rotateY(180deg)}
.mc-c{position:relative;height:100%;padding:18px 20px;display:flex;flex-direction:column}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mc-top .eyebrow{color:rgba(244,238,223,.7);font-size:10px}
.foil{background:linear-gradient(100deg,var(--foil-1),var(--foil-2) 42%,var(--foil-3) 62%,var(--foil-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mc-name{margin-top:auto;font:600 30px/1 var(--f-disp);letter-spacing:-.005em}
.mc-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:10px}
.mc-lv{display:flex;flex-direction:column;gap:6px}
.mc-lv .lbl{font:600 9.5px var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:rgba(244,238,223,.6)}
.mc-lv i{font:italic 600 21px/1 var(--f-disp)}
.ladder{display:flex;gap:4px}
.ladder span{width:18px;height:3px;border-radius:2px;background:rgba(244,238,223,.2)}
.ladder span.on{background:var(--foil-2)}
.mc-code{font:500 12px var(--f-mono);letter-spacing:.12em;color:rgba(244,238,223,.8);text-align:right}
.mc-k{width:30px;height:30px;color:var(--foil-2)}
.mc-k .d{fill:var(--foil-2)}
.mc-qr{position:relative;display:grid;place-items:center;align-content:center;gap:10px;height:100%;padding:16px;text-align:center}
.mc-qr canvas{width:44%;height:auto;aspect-ratio:1;background:var(--card-ink);border-radius:10px;padding:8px}
.mc-hint{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:-14px;font-size:12px;color:var(--ink-3)}

/* ---------- announcements ---------- */
.feed{display:flex;flex-direction:column;gap:16px}
.feat{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/5;max-width:100%;color:var(--on-art);isolation:isolate}
.feat canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.feat-c{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 40%,rgba(8,10,22,.55))}
.feat .eyebrow{color:rgba(251,246,236,.82)}
.feat-date{display:flex;align-items:flex-end;gap:10px;margin-top:auto}
.feat-date .n{font:500 112px/.78 var(--f-disp);letter-spacing:-.04em}
.feat-date .m{display:flex;flex-direction:column;font:600 11px/1.5 var(--f-body);letter-spacing:.18em;text-transform:uppercase;padding-bottom:6px}
.feat h3{font:italic 600 36px/1.02 var(--f-disp);margin-top:14px}
.feat .meta{font-size:14px;opacity:.9;margin-top:8px}
.feat .tagc{position:absolute;top:20px;right:20px}
.tagc{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font:600 11px var(--f-body);letter-spacing:.06em;background:rgba(251,246,236,.16);color:var(--on-art);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(251,246,236,.22)}
.thumb{position:relative;display:block;aspect-ratio:1;border-radius:18px;overflow:hidden;color:var(--on-art);max-width:100%}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb .dt{position:absolute;inset:auto 0 0 0;padding:8px 10px;display:flex;align-items:baseline;gap:5px;background:linear-gradient(180deg,transparent,rgba(8,10,22,.5))}
.thumb .dt b{font:600 34px/1 var(--f-disp)}
.thumb .dt span{font:600 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.ann h3{font:600 22px/1.08 var(--f-disp)}
.ann .meta{font-size:13px;color:var(--ink-2);margin-top:3px}
.annlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ann{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.ann:hover{background:var(--surface-2)}
.ann .thumb{border-radius:14px}
.ann .thumb .dt b{font-size:28px}
.ann .ann-t{display:flex;flex-direction:column;min-width:0}
.ann .meta{display:block}
.ann .go{color:var(--ink-3)}
.rs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink-3)}
.evhero{position:relative;margin:-10px calc(-1 * max(20px,env(safe-area-inset-left,0px))) 0;aspect-ratio:16/9;max-width:none;color:var(--on-art);overflow:hidden;flex:none}
.evhero canvas{position:absolute;inset:0;width:100%;height:100%}
.evhero.light{color:var(--night)}
.evc{position:absolute;inset:auto 0 0 0;padding:18px 20px;background:linear-gradient(180deg,transparent,rgba(8,10,22,.45))}
.evhero.light .evc{background:none}
.evd{display:flex;align-items:flex-end;gap:10px}
.evd b{font:500 84px/.8 var(--f-disp);letter-spacing:-.03em}
.evd span{font:600 11px/1.5 var(--f-body);letter-spacing:.16em;text-transform:uppercase;padding-bottom:4px}
.sheet:has(.evhero) .grab{position:relative;z-index:2;margin-bottom:-10px;background:rgba(255,255,255,.6)}
.rsvp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rsvp button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink-2)}
.rsvp button[aria-checked="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rsvp button[aria-checked="true"] .ic .d{fill:var(--accent-2)}
.faces{display:flex}
.faces .avatar{width:30px;height:30px;font-size:10.5px;border:2px solid var(--surface);margin-left:-8px}
.faces .avatar:first-child{margin-left:0}
.tag{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.tag .ic{width:14px;height:14px}
.lnk{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink-2);margin-top:8px}
.lnk:hover{color:var(--ink)}
.lnk .ic{width:16px;height:16px}
.hr{height:1px;background:var(--line)}
.vcan{display:block;width:100%;height:auto;border-radius:24px;max-width:100%;background:var(--surface-3)}
.vpost{display:flex;flex-direction:column;gap:10px}
.vpost .by{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}

/* ---------- communities ---------- */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cv{position:relative;aspect-ratio:3/4;border-radius:20px;overflow:hidden;color:var(--on-art);text-align:left;isolation:isolate;max-width:100%}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.cv .ccontent{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;background:linear-gradient(180deg,transparent 45%,rgba(8,10,22,.55))}
.cv .ic{width:38px;height:38px;stroke-width:1.2;color:var(--on-art)}
.cv h3{margin-top:auto;font:600 24px/1 var(--f-disp)}
.cv .s{font:600 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.82;margin-top:6px}
.cv .mine{position:absolute;top:14px;right:14px}
.cv.light,.cv.light .ic{color:var(--night)}
.cv.light .ccontent{background:linear-gradient(180deg,transparent 45%,rgba(255,250,240,.5))}
.cv.light .tagc{color:var(--night);background:rgba(17,22,46,.08);border-color:rgba(17,22,46,.15)}
.cv.light .ic .d{fill:var(--foil-1)}
.hero{position:relative;margin:-4px -18px 0;height:310px;color:var(--on-art);isolation:isolate;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .hc{position:absolute;inset:0;padding:16px 22px 22px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(8,10,22,.25),transparent 30%,rgba(8,10,22,.6))}
.hero.light{color:var(--night)}
.hero.light .hc{background:linear-gradient(180deg,transparent 40%,rgba(255,250,240,.55))}
.hero.light .ic .d{fill:var(--foil-1)}
.hero .back{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;align-self:flex-start;padding:6px 12px 6px 8px;border-radius:99px;background:rgba(251,246,236,.16);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hero.light .back{background:rgba(17,22,46,.08)}
.hero .ic.em{width:52px;height:52px;stroke-width:1.1;margin-top:auto}
.hero h1{font:600 48px/.95 var(--f-disp);letter-spacing:-.02em;margin-top:10px}
.hero .s{font:italic 500 20px var(--f-disp);opacity:.9;margin-top:6px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.facts div{background:var(--surface);padding:12px;min-width:0}
.facts b{display:block;font:600 14.5px/1.25 var(--f-body);margin-top:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 12px;font-weight:600;font-size:14px;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.orient{position:relative;padding:22px 22px 20px;border-radius:20px;background:var(--accent-soft)}
.orient q{display:block;font:italic 500 23px/1.25 var(--f-disp);quotes:"“" "”"}
.orient .by{margin-top:12px;font-size:13px;color:var(--ink-2)}
.ppl{display:flex;flex-wrap:wrap;gap:8px}
.ppl .p{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:500}
.ppl .avatar{width:28px;height:28px;font-size:11px}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- buttons, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--surface);font-weight:600;font-size:15px}

function kpiCards() {

  return [["Diezmos", "Diezmo", "+6 %"], ["Ofrendas", "Ofrenda", "+2 %"], ["Donaciones", "Donación", "−4 %"], ["Proyectos", "Proyecto", "+18 %"]].map(([l, t, d], i) =>

}
function barChart(series, keys, h = 210) {
  const W = 560, H = h, pl = 46, pb = 26, pt = 18, max = Math.max(...series.map((s) => keys.reduce((a, k) => a + s[k], 0)));
  const step = max > 2000 ? Math.ceil(max / 4 / 1000) * 1000 : Math.ceil(max / 4 / 50) * 50, top = step * 4, bw = (W - pl - 6) / series.length;
  const y = (v) => pt + (H - pt - pb) * (1 - v / top);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line class="gl" x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? v / 1000 + " mil" : v}</text>`; }
  series.forEach((s, i) => { let acc = 0; const x = pl + i * bw + bw * 0.2, w = bw * 0.6;
    keys.forEach((k, j) => { const v = s[k]; g += `<rect class="b${j + 1}" x="${x.toFixed(1)}" y="${y(acc + v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, y(acc) - y(acc + v)).toFixed(1)}"/>`; acc += v; });
    g += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${s.l}</text>`;
    if (keys.length === 1 || i === series.length - 1) g += `<text class="v" x="${x + w / 2}" y="${y(acc) - 6}" text-anchor="middle">${acc >= 1000 ? Q(acc) : acc}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

    <div class="panel"><h3>Cómo dan los hermanos</h3>${[["Transferencia", 46], ["Sobre con recibo", 41], ["Tarjeta", 13]].map(([n, v]) => `<div class="hbar"><span>${n}</span><div class="bar"><i style="width:${v * 2}%"></i></div><b class="num" style="text-align:right">${v} %</b></div>`).join("")}
      <div class="hr"></div><div class="sec-h"><h3 style="font-size:20px">Por confirmar</h3><span class="pill warn">${pend.length}</span></div>
      <div class="list">${pend.map((m) => `<div class="li" style="padding:10px 0"><div class="g"><b>${esc(m.who)}</b><span class="s">${m.t} · ${esc(m.dest)} · ${m.m} · ${m.rc}</span></div><b class="num">${Q(m.a)}</b><button class="btn sm" data-conf="${m.id}">Confirmar</button></div>`).join("") || '<p class="muted">Todo confirmado.</p>'}</div></div></div>`;
}
function cMovimientos() {
  const list = MOVES.filter((m) => S.mt2 === "todos" || m.t === S.mt2);
  return `<div class="tools">${dd("mt2", { label: "Tipo", options: () => [{ v: "todos", l: "Todos" }, { v: "Diezmo", l: "Diezmos" }, { v: "Ofrenda", l: "Ofrendas" }, { v: "Donación", l: "Donaciones" }, { v: "Proyecto", l: "Proyectos" }], value: () => S.mt2, pick: (v) => (S.mt2 = v) })}
    <button class="btn sm" data-act="sobre" style="margin-left:auto">${ic("sobre", "sm")}Registrar sobre</button></div>
    <div class="twrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Hermano</th><th>Tipo</th><th>Destino</th><th>Método</th><th class="r">Monto</th><th>Recibo</th><th>Estado</th></tr></thead><tbody>
    ${list.map((m) => `<tr><td class="num">${m.f}</td><td><b style="font-weight:600">${esc(m.who)}</b></td><td>${m.t}</td><td class="muted">${esc(m.dest)}</td><td>${m.m}</td><td class="r num"><b>${Q(m.a)}</b></td><td class="mono" style="font-size:12.5px">${m.rc}</td><td>${m.st === "Confirmado" ? '<span class="pill ok">Confirmado</span>' : `<button class="pill warn" data-conf="${m.id}">Por confirmar</button>`}</td></tr>`).join("")}</tbody></table></div>`;
}
function sobreDrawer() {
  drawer(`<div class="row" style="justify-content:space-between"><span class="eyebrow">Mayordomía</span><button class="iconbtn" data-act="close" aria-label="Cerrar">${ic("close")}</button></div>
    <h2>Registrar sobre</h2><p class="muted" style="margin-top:-8px">El hermano recibe su recibo digital en Kaleos y por WhatsApp.</p>
    <div class="field"><label for="sw">Hermano</label><select class="inp" id="sw"><option>Anónimo</option>${NAMES.map((n) => `<option>${n}</option>`).join("")}</select></div>
    <div class="row"><div class="field" style="flex:1"><label for="stp">Tipo</label><select class="inp" id="stp"><option>Diezmo</option><option>Ofrenda</option><option>Donación</option><option>Proyecto</option></select></div>
    <div class="field" style="flex:1"><label for="sa">Monto (Q)</label><input class="inp num" id="sa" inputmode="numeric" value="250"></div></div>
    <div class="field"><label for="sd">Destino</label><select class="inp" id="sd"><option>General</option><option>Gratitud</option><option>Siembra</option><option>Promesa de fe</option>${NEEDS.map((n) => `<option>${n.n}</option>`).join("")}${PROJECTS.map((p) => `<option>${p.n}</option>`).join("")}</select></div>
    <div class="field"><label for="sn">Número de sobre</label><input class="inp mono" id="sn" value="S-0${381 + MOVES.length}"></div>
    <div class="row" style="margin-top:auto"><button class="btn sec" style="flex:1" data-act="close">Cancelar</button><button class="btn" style="flex:2" id="ssave">${ic("check", "sm")}Registrar y enviar recibo</button></div>`, (d) => {
    $("#ssave", d).addEventListener("click", () => {
      MOVES.unshift({ id: Date.now(), f: "27 oct", who: $("#sw", d).value, t: $("#stp", d).value, dest: $("#sd", d).value, m: "Sobre", a: parseInt($("#sa", d).value) || 0, rc: $("#sn", d).value, st: "Confirmado" });
      closeAll(); render(); toast("Sobre registrado. Recibo digital enviado.");
    });
  });
}
function cProyectos() {
  return `<div class="pgrid">${PROJECTS.map((p) => `<div class="proj"><span class="thumb" style="aspect-ratio:2;border-radius:14px">${artCv(p.k, p.p, p.id + 30)}</span><span class="eyebrow">${p.s}</span><h3>${p.n}</h3>
    <div class="bar"><i style="width:${pct(p.got, p.goal)}%"></i></div><div class="amts"><span><b class="num">${Q(p.got)}</b> de ${Q(p.goal)}</span><span>${p.until}</span></div></div>`).join("")}</div>`;
}
function renderCentral() {
  const secs = CSECS[S.view];
  if (!secs.find((s) => s[0] === S.cs)) S.cs = secs[0][0];
  const cur = secs.find((s) => s[0] === S.cs);
  const views = { personas: cPersonas, comunidades: cComunidades, agenda: cAgenda, avisos: cAvisos, informes: cInformes, resumen: cResumen, movimientos: cMovimientos, proyectos: cProyectos };
  const title = { personas: "Registro de <em>personas</em>", comunidades: "Comunidades", agenda: "Agenda y <em>servicios</em>", avisos: "Avisos", informes: "Informes de <em>octubre</em>", resumen: "Mayordomía, <em>octubre</em>", movimientos: "Movimientos", proyectos: "Proyectos" }[S.cs];
  const seg = `<div class="seg">${[["secretaria", "Secretaría", "registro"], ["mayordomia", "Mayordomía", "dar"]].map(([k, l, i]) => `<button data-cv="${k}" aria-pressed="${S.view === k}">${ic(i)}${l}</button>`).join("")}</div>`;
  return `<div class="desk">
    <aside class="side"><div class="wm row" style="gap:8px">${ic("kaleos")}<div><b>Kaleos</b><span>Central</span></div></div>
      ${seg}
      <nav aria-label="Secciones"><span class="eyebrow">${S.view === "secretaria" ? "Secretaría" : "Mayordomía"}</span>${secs.map(([k, l, i, n]) => `<button class="nv" data-cs="${k}" aria-current="${S.cs === k ? "page" : "false"}">${ic(i)}${l}<span class="n">${n()}</span></button>`).join("")}</nav>
      <div class="duty"><span class="eyebrow">De turno hoy</span><b style="margin-top:6px">Hno. Esteban López</b><span class="muted" style="font-size:12.5px">Secretario y tesorero</span></div></aside>
    <section class="dmain">
      <div class="mob-nav">${seg}${dd("csec", { icon: cur[2], options: () => secs.map(([v, l, i]) => ({ v, l, icon: i })), value: () => S.cs, pick: (v) => (S.cs = v) })}</div>
      <div class="dtop"><h1>${title}</h1></div>
      ${views[S.cs]()}
    </section></div>`;
}

// ================= render y eventos =================
function render() {
  renderDemo();
  $("#stage").innerHTML = S.role === "miembro" ? renderMember() : S.role === "pastor" ? renderPastor() : renderCentral();
  requestAnimationFrame(() => paintArt());
}
function nav(fn) { fn(); render(); window.scrollTo(0, 0); }
const SEL = "[data-ann],[data-rsvp],[data-ddt],[data-ddp],[data-role],[data-mt],[data-comm],[data-ct],[data-req],[data-act],[data-gt],[data-give],[data-ask],[data-aa],[data-st],[data-sp],[data-sl],[data-rs],[data-day],[data-person],[data-cv],[data-cs],[data-row],[data-conf]";
document.addEventListener("click", (e) => {
  const t = e.target.closest(SEL);
  if (!t) { if (!e.target.closest(".dd-menu")) closeDD(); if (e.target.id === "scrim") closeAll(); return; }
  const d = t.dataset;
  if (d.ddt) { const box = t.closest(".dd"), was = box.classList.contains("open"); closeDD(); if (!was) { box.classList.add("open"); t.setAttribute("aria-expanded", "true"); } return; }
  if (d.ddp) {
    const c = DD[d.ddp]; c.pick(d.v);
    if (c.keep) { render(); const b = $(`.dd[data-dd="${d.ddp}"]`); if (b) { b.classList.add("open"); $(".dd-btn", b).setAttribute("aria-expanded", "true"); } }
    else { closeDD(); render(); if (["psec", "csec", "mmenu"].includes(d.ddp)) window.scrollTo(0, 0); }
    return;
  }
  closeDD();
  if (d.ann) return annSheet(d.ann);
  if (d.rsvp) { const [id, k] = d.rsvp.split(":"); S.rsvp[id] = S.rsvp[id] === k ? undefined : k; render(); annSheet(id); return toast(S.rsvp[id] === "si" ? "Asistencia confirmada. Le recordaremos un día antes." : S.rsvp[id] ? "Guardado" : "Respuesta quitada"); }
  if (d.role) return nav(() => { S.role = d.role; S.comm = null; });
  if (d.mt) return nav(() => { S.mt = d.mt; S.comm = null; });
  if (d.comm) return nav(() => { S.comm = d.comm; S.ctab = "avisos"; });
  if (d.ct) { S.ctab = d.ct; return render(); }
  if (d.req) return reqSheet(d.req);
  if (d.gt) { S.giveTab = d.gt; return render(); }
  if (d.give) { const [a, b] = d.give.split("|"); return giveSheet(a, b); }
  if (d.ask) return ask(d.q || t.textContent.trim(), d.ask);
  if (d.aa) {
    if (d.aa.startsWith("go:")) return nav(() => { S.psec = d.aa.slice(3); });
    if (S.psec !== "asistente") S.psec = "asistente";
    const lbl = d.aa.startsWith("card:") ? "Prepara la tarjeta" : d.aa.startsWith("sent:") ? "Sí, envíalo" : d.aa === "cumple" ? "Felicitar a los cumpleañeros" : t.textContent.trim();
    return ask(lbl, d.aa);
  }
  if (d.st) { S.studio.kind = d.st; return render(); }
  if (d.sp) { S.studio.pal = d.sp; return render(); }
  if (d.sl) { S.studio.layout = d.sl; return render(); }
  if (d.rs) { const [id, st] = d.rs.split(":"); const r = REQS.find((x) => x.id === +id); r.st = st; const m = MYREQS.find((x) => x.id === +id); if (m) m.st = st; toast(st === "atendida" ? "Marcado como atendido" : "Actualizado"); return render(); }
  if (d.day) { S.day = +d.day; return render(); }
  if (d.person) return personSheet(d.person);
  if (d.cv) return nav(() => { S.view = d.cv; });
  if (d.cs) return nav(() => { S.cs = d.cs; });
  if (d.row) { const [k, id] = d.row.split(":"); return k === "p" ? editPerson(id) : editComm(id); }
  if (d.conf) { const m = MOVES.find((x) => x.id === +d.conf); m.st = "Confirmado"; toast("Confirmado. Se envió el recibo al hermano."); return render(); }
  const a = d.act;
  if (a === "close") return closeAll();
  if (a === "flip") { S.flip = !S.flip; t.classList.toggle("flip", S.flip); return paintArt(); }
  if (a === "back") return nav(() => (S.comm = null));
  if (a === "wa") return toast("Abriría WhatsApp con el mensaje listo (ejemplo)");
  if (a === "join") return toast("Pedido enviado al encargado de " + COMMS[d.k].n);
  if (a === "orient") { const v = $("#orientTxt").value.trim(); if (!v) return toast("Escriba la orientación"); COMMS[d.k].o = v; render(); return toast("Publicada en Kaleos; WhatsApp listo para el grupo"); }
  if (a === "mic") return toast("En Kaleos real, el pastor habla y el asistente escucha");
  if (a === "firma") { S.studio.firma = !S.studio.firma; return render(); }
  if (a === "vseed") { S.studio.seed = 1 + Math.floor(Math.random() * 90); return render(); }
  if (a === "vwa") return toast("Abriría WhatsApp para enviar la imagen a la comunidad (ejemplo)");
  if (a === "vpub") { const o = studioOpts(); S.published.unshift({ ...o, fmt: o.fmt === "historia" ? "post" : o.fmt, label: "Versículo de hoy" }); return toast("Publicado. Véalo en Miembro → Inicio."); }
  if (a === "bsave") { closeAll(); return toast("Nota guardada en la bitácora"); }
  if (a === "newrem") return sheet(`<h2>Nuevo recordatorio</h2><div class="field"><label for="rt1">¿Qué?</label><input class="inp" id="rt1" value="Llamar a la hna. Marta"></div><div class="row"><div class="field" style="flex:1"><label for="rt2">Día</label><input class="inp" type="date" id="rt2" value="2026-10-28"></div><div class="field" style="flex:1"><label for="rt3">Hora</label><input class="inp" type="time" id="rt3" value="09:00"></div></div><button class="toggle" role="switch" aria-checked="false" data-act="tog"><i></i>Avisar también a los hermanos por WhatsApp</button><button class="btn block" data-act="remok">Guardar</button>`);
  if (a === "tog") return t.setAttribute("aria-checked", t.getAttribute("aria-checked") !== "true");
  if (a === "remok") { closeAll(); return toast("Recordatorio guardado"); }
  if (a === "newperson") return editPerson(0);
  if (a === "newann") return newAnn();
  if (a === "sobre") return sobreDrawer();
  if (a === "sendroster") return toast("Turnos enviados a cada persona por Kaleos y WhatsApp (ejemplo)");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeDD(); closeAll(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".mc")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "askf") return; e.preventDefault();
  const v = $("#askq").value.trim(); if (v) ask(v);
});
document.addEventListener("input", (e) => {
  const id = e.target.id;
  if (id === "hq" || id === "pq") {
    S[id] = e.target.value; const pos = e.target.selectionStart; render();
    const el = $("#" + id); el.focus(); el.setSelectionRange(pos, pos);
  }
  if (id === "cref" || id === "ctext") {
    S.studio[id] = e.target.value;
    const cv = $(".prev canvas"); if (cv) { VC[cv.dataset.vc] = studioOpts(); drawVerse(cv, VC[cv.dataset.vc]); }
  }
});
document.addEventListener("change", (e) => {
  const r = e.target.dataset.ros; if (!r) return;
  const [i, f] = r.split(":"); ROSTER[+i][f] = e.target.value; toast("Turno asignado");
});
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => paintArt(), 150); });
render();
if (document.fonts) {
  Promise.all(['italic 500 40px "Cormorant Garamond"', '600 40px "Cormorant Garamond"', '700 40px "Cormorant Garamond"', '600 20px "Hanken Grotesk"'].map((f) => document.fonts.load(f).catch(() => {})))
    .then(() => $$("canvas[data-vc]").forEach((cv) => VC[cv.dataset.vc] && drawVerse(cv, VC[cv.dataset.vc])));
}
})();
</script>
</body>
</html>
